workstation:
  name: "Local OSINT Workstation"
  version: "0.2.0"
services:
  searxng_port: 8888
  spiderfoot_port: 5001
  yacy_port: 8090
orchestrator:
  max_workers: 8
  default_timeout: 20
  user_agent: "OSINT-Workstation/1.0 (authorized local research; contact: local)"
  verify_ssl: true
confidence:
  # scoring weights (documentary — actual values in core/process.confidence_score)
  direct_observation: 0.8
  multi_source_correlated: 0.7
  single_source: 0.5
  inferred: 0.35
  unverified: 0.15
storage:
  investigations_dir: "investigations"
  reports_dir: "reports"
