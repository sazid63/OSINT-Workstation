id: nuclei
name: Nuclei (templates)
category: Web & URL
description: Template-based vulnerability checks against a host you are authorized to test.
how_to_use: |
  1. Type a URL or host you OWN or are AUTHORIZED to test.
  2. Click Run. The first run downloads the community templates.
  3. Nuclei reports findings by severity. Treat results as hints, not proof.
important: |
  ACTIVE TOOL. Only test systems you own or have written permission to test.
what_to_connect:
  - "Nuclei binary (ProjectDiscovery)"
safety: active
license: MIT
homepage: https://github.com/projectdiscovery/nuclei
inputs:
  - name: target
    label: URL or host
    placeholder: example.com
command: ["nuclei", "-u", "{target}", "-silent", "-severity", "low,medium,high,critical"]
install:
  method: binary
  url: https://github.com/projectdiscovery/nuclei/releases
tags: [web, vulnerabilities, active]
